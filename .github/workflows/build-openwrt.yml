name: Build OpenWrt

on:
  # 手动触发（推荐，可在 Actions 页面直接点击）
  workflow_dispatch:
  # push .config 时自动触发
  push:
    branches:
      - main
    paths:
      - '.config'
      - '.github/workflows/build-openwrt.yml'
      - 'files/**'
  # 发布 Release 时触发
  release:
    types: published

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Cancel outdated workflow runs
      run: |
        # 新提交构建前取消同仓库内仍在运行的旧 run，避免并行占满 runner
        gh run list --repo "${{ github.repository }}" --json databaseId,status \
          --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' \
        | while read -r id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            echo "Cancelling run $id"
            gh run cancel "$id" --repo "${{ github.repository }}" || true
          done
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 删除预装的大型软件包以释放磁盘空间（OpenWRT 编译需要约 30GB）
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune -a -f 2>/dev/null || true
        sudo -E apt-get -qq purge \
          azure-cli* docker* ghc* zulu* llvm* firefox \
          google-chrome-stable google-cloud-sdk dotnet* powershell \
          openjdk* php* ruby* 2>/dev/null || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        # Lean LEDE 在 ubuntu-22.04 上所需的编译依赖
        sudo -E apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
          haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache downloaded packages
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-${{ hashFiles('.config') }}
        restore-keys: openwrt-dl-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: openwrt-ccache-ath79-${{ github.run_id }}
        restore-keys: openwrt-ccache-ath79-

    - name: Inject custom feeds
      run: |
        cd openwrt
        # mihomo 不在 lede 默认 feeds 中，需在 update 前注入外部源
        sed -i '$a src-git mihomo https://github.com/morytyann/OpenWrt-mihomo.git;main' feeds.conf.default

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Use Argon as sole LuCI theme
      run: |
        cd openwrt
        # luci 元包依赖 luci-light，默认写死 luci-theme-bootstrap；改为 argon 后可不编 bootstrap
        f=feeds/luci/collections/luci-light/Makefile
        if ! grep -q 'luci-theme-bootstrap' "$f"; then
          echo "WARN: luci-light Makefile anchor changed, check manually"
          grep luci-theme "$f" || true
        else
          sed -i 's/+luci-theme-bootstrap/+luci-theme-argon/' "$f"
          echo "Patched luci-light: bootstrap -> argon"
          grep luci-theme "$f"
        fi

    - name: Fix mihomo feed circular dependency
      run: |
        cd openwrt
        # mihomo-alpha 与 mihomo-meta 在 Kconfig 中互相依赖，会导致 make defconfig 报错
        # 只删除 alpha，保留 mihomo-meta（PROVIDES mihomo，供 nikki 依赖）
        rm -rf feeds/mihomo/mihomo-alpha
        # 若 packages feed 也有 nikki，会与 mihomo feed 的 nikki 冲突，导致固件漏编
        if [ -d feeds/packages/net/nikki ]; then
          rm -rf feeds/packages/net/nikki
          echo "Removed conflicting feeds/packages/net/nikki"
        fi
        ./scripts/feeds install -p mihomo -a

    - name: Fix ath79 eth0 syscon-no-reset (kernel 6.6 MDIO probe)
      run: |
        cd openwrt
        # 根本原因：kernel 6.6 的 syscon 驱动在注册 eth0 regmap 时
        # 会尝试获取 eth0 的 exclusive reset control（rst 9），
        # 但该 reset 已被 ag71xx_legacy 驱动持有 → -EBUSY → MDIO probe 失败 → 无以太网
        #
        # 修复：在 ath79.dtsi 的 eth 节点加上 syscon-no-reset 属性，
        # 跳过 syscon 的 reset 获取（补丁 820 已支持此属性）
        python3 -c "
        content = open('target/linux/ath79/dts/ath79.dtsi').read()
        fixed = content.replace(
            'compatible = \"qca,ath79-eth\", \"syscon\";',
            'compatible = \"qca,ath79-eth\", \"syscon\";\n\t\t\tsyscon-no-reset;'
        )
        open('target/linux/ath79/dts/ath79.dtsi', 'w').write(fixed)
        changed = fixed.count('syscon-no-reset')
        print(f'Patched ath79.dtsi: added syscon-no-reset to {changed} eth node(s)')
        "

    - name: Fix GL-AR750S nor-nand sysupgrade metadata
      run: |
        cd openwrt
        # LEDE 上游 bug：nor-nand 镜像的 SUPPORTED_DEVICES 只有 glinet,gl-ar750s-nor，
        # 缺少 glinet,gl-ar750s-nor-nand，导致 sysupgrade 校验失败、无法写入永久系统
        python3 <<'PYEOF'
        path = "target/linux/ath79/image/nand.mk"
        content = open(path).read()
        old = (
            "  SUPPORTED_DEVICES += glinet,gl-ar750s-nor\n"
            "endef\n"
            "TARGET_DEVICES += glinet_gl-ar750s-nor-nand"
        )
        new = (
            "  SUPPORTED_DEVICES += gl-ar750s glinet,gl-ar750s "
            "glinet,gl-ar750s-nor glinet,gl-ar750s-nor-nand\n"
            "endef\n"
            "TARGET_DEVICES += glinet_gl-ar750s-nor-nand"
        )
        if old not in content:
            raise SystemExit("nand.mk patch anchor not found")
        open(path, "w").write(content.replace(old, new, 1))
        print("Patched nand.mk: nor-nand image now supports glinet,gl-ar750s-nor-nand")
        PYEOF

    - name: Enable ath79 USB PHY in kernel config
      run: |
        cd openwrt
        # 上游 config-6.6 默认未启用 PHY 模块，kmod-phy-ath79-usb 将无法生成 .ko
        cfg=target/linux/ath79/config-6.6
        sed -i 's/# CONFIG_PHY_AR7100_USB is not set/CONFIG_PHY_AR7100_USB=m/' "$cfg"
        sed -i 's/# CONFIG_PHY_AR7200_USB is not set/CONFIG_PHY_AR7200_USB=m/' "$cfg"
        grep -E 'CONFIG_PHY_AR7.*USB' "$cfg"

    - name: Load configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config

    - name: SSH connection (debug, triggered by 'ssh' label)
      uses: mxschmitt/action-tmate@v3
      if: contains(github.event.action, 'ssh')
      timeout-minutes: 30

    - name: Download package
      id: package
      timeout-minutes: 45
      run: |
        cd openwrt
        make defconfig
        # defconfig 可能因依赖未解析而清掉 nikki/PHY，强制写回关键包（LEDE 无 scripts/config 可执行文件，用 sed）
        force_pkg() {
          sed -i "/^CONFIG_PACKAGE_${1}=/d" .config
          echo "CONFIG_PACKAGE_${1}=y" >> .config
        }
        disable_pkg() {
          sed -i "/^CONFIG_PACKAGE_${1}=/d" .config
          echo "# CONFIG_PACKAGE_${1} is not set" >> .config
        }
        for sym in \
          mihomo-meta nikki luci-app-nikki luci-i18n-nikki-zh-cn yq \
          kmod-phy-ath79-usb kmod-usb2 kmod-usb-storage kmod-scsi-core \
          kmod-fs-vfat block-mount usbutils \
          luci-theme-argon luci-app-argon-config; do
          force_pkg "$sym"
        done
        for sym in \
          luci-theme-bootstrap luci-theme-material luci-theme-design \
          luci-theme-openwrt luci-theme-openwrt-2020; do
          disable_pkg "$sym"
        done
        make defconfig
        for sym in PACKAGE_nikki PACKAGE_luci-app-nikki PACKAGE_kmod-phy-ath79-usb PACKAGE_mihomo-meta PACKAGE_luci-theme-argon; do
          grep -q "CONFIG_${sym}=y" .config || { echo "ERROR: CONFIG_${sym} missing after defconfig"; exit 1; }
        done
        for sym in PACKAGE_luci-theme-bootstrap PACKAGE_luci-theme-material; do
          grep -q "^CONFIG_${sym}=y" .config && { echo "ERROR: ${sym} should be disabled"; exit 1; }
        done
        echo "OK: Nikki, USB PHY, and Argon-only theme in .config"
        # 并行下载，失败后单线程重试（逐包重试可绕过单个慢源挂死）
        make download -j8 || make download -j1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        # 使用新语法替代废弃的 ::set-output / ::set-env
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Verify sysupgrade image metadata
      run: |
        cd openwrt/bin/targets/ath79/nand
        IMG=$(ls *glinet_gl-ar750s-nor-nand*squashfs-sysupgrade.bin 2>/dev/null | head -1)
        if [ -z "$IMG" ]; then
          echo "ERROR: nor-nand sysupgrade.bin not found"
          exit 1
        fi
        ls -lh "$IMG"
        strings "$IMG" | grep -q 'glinet,gl-ar750s-nor-nand' || {
          echo "ERROR: metadata missing glinet,gl-ar750s-nor-nand"
          exit 1
        }
        echo "OK: sysupgrade metadata includes glinet,gl-ar750s-nor-nand"

    - name: Verify packages in firmware manifest
      run: |
        cd openwrt
        MANIFEST=bin/targets/ath79/nand/packages/Packages.manifest
        if [ ! -f "$MANIFEST" ]; then
          echo "ERROR: Packages.manifest not found"
          exit 1
        fi
        for pkg in mihomo-meta nikki luci-app-nikki kmod-phy-ath79-usb kmod-usb2 luci-theme-argon; do
          grep -q "^${pkg} " "$MANIFEST" || { echo "ERROR: package ${pkg} not in firmware manifest"; exit 1; }
        done
        for pkg in luci-theme-bootstrap luci-theme-material luci-theme-design; do
          if grep -q "^${pkg} " "$MANIFEST"; then
            echo "ERROR: ${pkg} should not be in firmware (Argon-only)"
            exit 1
          fi
        done
        echo "OK: critical packages in manifest; extra themes excluded"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
